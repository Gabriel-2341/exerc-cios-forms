<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01</title>
</head>
<body>
    <h1>Deixe um Comentário!</h1>
    <form>
        <label for="nome">Nome:</label>
        <br>
        <input type="text" id="nome" style="width: 460px; height: 20px"/>
        <br>
        <label for="email">E-mail:</label>
        <br>
        <input type="email" id ="email" style="width: 460px; height: 20px"/>
        <br>   
        <label for="site">Website:</label>
        <br>
        <input type="url" id="site" style="width: 460px; height: 20px"/>
        <br>
        <label for="coment">Comentário:</label>
        <br>
        <textarea id="coment" style="width: 460px; height: auto; min-height: 50px; resize: none; overflow-y: hidden;"></textarea>
        <br>
        <p>Observação: Seu comentário será publicado após passar pelo moderador</p>
        <input type="submit" placeholder="Enviar Formulário">
    </form>
</body>
</html>
